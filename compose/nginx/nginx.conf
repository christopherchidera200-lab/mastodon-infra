# Mastodon nginx configuration
# Handles: HTTP→HTTPS redirect, Let's Encrypt ACME, WebSocket streaming

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Logging
  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log warn;

  # Performance
  sendfile        on;
  keepalive_timeout 65;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript;

  # WebSocket connection upgrade map
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # ── HTTP — redirect to HTTPS + Let's Encrypt ACME challenge ──
  server {
    listen 80;
    listen [::]:80;
    server_name mastodon.dpdns.org;

    # Let's Encrypt verification
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    # Redirect all other HTTP → HTTPS
    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ── HTTPS — main Mastodon server ──────────────────────────────
  server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mastodon.dpdns.org;

    # TLS certificates from Let's Encrypt
    ssl_certificate     /etc/letsencrypt/live/mastodon.dpdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mastodon.dpdns.org/privkey.pem;

    # Modern TLS settings
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    nosniff always;
    add_header X-Frame-Options           SAMEORIGIN always;
    add_header X-XSS-Protection          "0" always;
    add_header Referrer-Policy           same-origin always;

    # Max upload size (media attachments)
    client_max_body_size 99m;

    # Timeouts for federation
    proxy_read_timeout    300s;
    proxy_send_timeout    300s;
    proxy_connect_timeout 60s;

    # ── Streaming WebSocket ─────────────────────────────────────
    location /api/v1/streaming {
      proxy_pass         http://streaming:4000;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        $connection_upgrade;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto https;
      proxy_cache_bypass $http_upgrade;
    }

    location /api/v2/streaming {
      proxy_pass         http://streaming:4000;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        $connection_upgrade;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto https;
      proxy_cache_bypass $http_upgrade;
    }

    # ── Mastodon web (Puma) ─────────────────────────────────────
    location / {
      proxy_pass         http://web:3000;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto https;
      proxy_set_header   X-Forwarded-Port  443;
      proxy_set_header   Proxy             "";
    }
  }
}
