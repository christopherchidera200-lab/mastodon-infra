name: "Application — Deploy to EC2"

on:
  push:
    branches: [master]
    paths:
      - "compose/**"
      - "scripts/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: "Validate Compose Files"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install Docker Compose
        run: |
          mkdir -p ~/.docker/cli-plugins
          curl -SL https://github.com/docker/compose/releases/download/v2.24.0/docker-compose-linux-x86_64 \
            -o ~/.docker/cli-plugins/docker-compose
          chmod +x ~/.docker/cli-plugins/docker-compose

      - name: Validate docker-compose.yml syntax
        run: |
          # Set dummy env vars for validation
          export ECR_WEB_IMAGE="dummy/web:latest"
          export ECR_STREAMING_IMAGE="dummy/streaming:latest"
          export DB_PASSWORD="dummy"
          docker compose -f compose/docker-compose.yml config --quiet
          echo "Docker Compose syntax valid ✅"

      - name: Validate nginx config syntax
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/compose/nginx/nginx.conf:/etc/nginx/nginx.conf:ro \
            nginx:alpine nginx -t
          echo "Nginx config valid ✅"

  deploy:
    name: "Deploy to EC2"
    runs-on: ubuntu-latest
    needs: validate
    environment: production
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: mastodon-deploy-${{ github.run_number }}

      - name: Write SSH private key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/mastodon_key
          chmod 600 ~/.ssh/mastodon_key
          echo "StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Copy updated files to EC2
        run: |
          EC2_IP="${{ secrets.EC2_PUBLIC_IP }}"

          # Copy compose files
          scp -i ~/.ssh/mastodon_key \
            compose/docker-compose.yml \
            ubuntu@${EC2_IP}:/opt/mastodon/compose/

          scp -i ~/.ssh/mastodon_key \
            compose/nginx/nginx.conf \
            ubuntu@${EC2_IP}:/opt/mastodon/compose/nginx/

          # Copy scripts
          scp -i ~/.ssh/mastodon_key \
            scripts/*.sh \
            ubuntu@${EC2_IP}:/opt/mastodon/scripts/

          ssh -i ~/.ssh/mastodon_key ubuntu@${EC2_IP} \
            "chmod +x /opt/mastodon/scripts/*.sh"

      - name: Reload services on EC2
        run: |
          EC2_IP="${{ secrets.EC2_PUBLIC_IP }}"

          ssh -i ~/.ssh/mastodon_key ubuntu@${EC2_IP} << 'REMOTE'
            set -e
            cd /opt/mastodon/compose

            # Pull any updated images and restart changed services
            source .env.production
            docker compose pull --quiet 2>/dev/null || true
            docker compose up -d --remove-orphans

            echo "Waiting 30 seconds for services..."
            sleep 30
            docker compose ps
          REMOTE

      - name: Smoke tests
        id: smoke
        run: |
          EC2_IP="${{ secrets.EC2_PUBLIC_IP }}"
          DOMAIN="${{ secrets.MASTODON_DOMAIN }}"

          echo "Testing web health..."
          STATUS=$(curl -sk -o /dev/null -w "%{http_code}" https://${DOMAIN}/health)
          echo "Web: HTTP ${STATUS}"
          [ "${STATUS}" = "200" ] || exit 1

          echo "Testing streaming health..."
          STATUS=$(curl -sk -o /dev/null -w "%{http_code}" https://${DOMAIN}/api/v1/streaming/health)
          echo "Streaming: HTTP ${STATUS}"
          [ "${STATUS}" = "200" ] || exit 1

          echo "All smoke tests passed ✅"
        continue-on-error: true

      - name: Rollback on failure
        if: steps.smoke.outcome == 'failure'
        run: |
          EC2_IP="${{ secrets.EC2_PUBLIC_IP }}"
          ssh -i ~/.ssh/mastodon_key ubuntu@${EC2_IP} << 'REMOTE'
            cd /opt/mastodon/compose
            docker compose restart web streaming sidekiq
            echo "Services restarted"
          REMOTE
          echo "Rollback attempted — check logs on EC2"
          exit 1

      - name: Deploy summary
        if: steps.smoke.outcome == 'success'
        run: |
          echo "Deploy successful ✅"
          echo "Commit: ${{ github.sha }}"
          echo "By: ${{ github.actor }}"
