name: "Infrastructure — Terraform"

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
  workflow_dispatch:

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  terraform-plan:
    name: "Validate & Plan"
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      # OIDC — no static AWS keys
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: mastodon-tf-plan-${{ github.run_number }}

      - name: Write SSH public key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > ~/.ssh/mastodon_key.pub
          chmod 644 ~/.ssh/mastodon_key.pub

      - name: Terraform Init
        working-directory: terraform/envs/prod
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform/envs/prod
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        working-directory: terraform/envs/prod
        run: |
          terraform plan \
            -no-color \
            -detailed-exitcode \
            -out=tfplan \
            -var="aws_region=us-east-1" \
            -var="aws_account_id=${{ secrets.AWS_ACCOUNT_ID }}" \
            -var="ssh_key_name=mastodon-key" \
            -var="ssh_public_key_path=$HOME/.ssh/mastodon_key.pub" \
            -var="instance_type=t3.small" \
            -var="mastodon_domain=${{ secrets.MASTODON_DOMAIN }}" \
            -var="mastodon_email=${{ secrets.MASTODON_EMAIL }}" \
            -var="mastodon_version=${{ secrets.MASTODON_VERSION }}" \
            -var="github_repo=${{ secrets.GITHUB_REPO }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}"
        continue-on-error: true

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/envs/prod/tfplan
          retention-days: 1

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan\n\`\`\`\n${{ steps.plan.outputs.stdout }}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Fail if plan errored
        if: steps.plan.outputs.exitcode == 1
        run: exit 1

  terraform-apply:
    name: "Apply Infrastructure"
    runs-on: ubuntu-latest
    needs: terraform-plan
    environment: production
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: mastodon-tf-apply-${{ github.run_number }}

      - name: Write SSH public key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > ~/.ssh/mastodon_key.pub

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform/envs/prod/

      - name: Terraform Init
        working-directory: terraform/envs/prod
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform/envs/prod
        run: terraform apply -no-color -auto-approve tfplan
