name: "OIDC lab (temporary)"

on:
  push:
    branches: [master, lab-test]
  pull_request:
    branches: [master]

permissions:
  id-token: write
  contents: read

jobs:
  no-environment:
    name: "No environment / ${{ matrix.label }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: plan, arn: "arn:aws:iam::873871686800:role/mastodon-github-actions-lab" }
          - { label: deploy, arn: "arn:aws:iam::873871686800:role/mastodon-github-deploy-lab" }
    steps:
      - name: Try to assume the role
        id: assume
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ matrix.arn }}
          aws-region: us-east-1
      - name: Result
        run: echo "RESULT event=${{ github.event_name }} ref=${{ github.ref }} role=${{ matrix.label }} outcome=${{ steps.assume.outcome }}"

  with-environment:
    name: "Environment production / ${{ matrix.label }}"
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: plan, arn: "arn:aws:iam::873871686800:role/mastodon-github-actions-lab" }
          - { label: deploy, arn: "arn:aws:iam::873871686800:role/mastodon-github-deploy-lab" }
    steps:
      - name: Try to assume the role
        id: assume
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ matrix.arn }}
          aws-region: us-east-1
      - name: Result
        run: echo "RESULT event=${{ github.event_name }} ref=${{ github.ref }} role=${{ matrix.label }} outcome=${{ steps.assume.outcome }}"

  show-claims:
    name: "Show claims / no environment"
    runs-on: ubuntu-latest
    steps:
      - name: Print claims
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "::add-mask::$TOKEN"
          echo "$TOKEN" | python3 -c "import sys,json,base64;p=sys.stdin.read().strip().split('.')[1];p+='='*(-len(p)%4);c=json.loads(base64.urlsafe_b64decode(p));print(json.dumps({k:c.get(k) for k in ['sub','aud','iss','repository','repository_owner','ref','event_name']},indent=1))"

  show-claims-env:
    name: "Show claims / environment production"
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Print claims
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "::add-mask::$TOKEN"
          echo "$TOKEN" | python3 -c "import sys,json,base64;p=sys.stdin.read().strip().split('.')[1];p+='='*(-len(p)%4);c=json.loads(base64.urlsafe_b64decode(p));print(json.dumps({k:c.get(k) for k in ['sub','aud','iss','repository','repository_owner','ref','event_name','environment']},indent=1))"
